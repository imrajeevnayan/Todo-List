<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.7/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body class="bg-gray-100">
<div id="root" class="container mx-auto p-4"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    // TodoItem Component
    function TodoItem({ todo, onUpdate, onComplete, onDelete }) {
        const [isEditing, setIsEditing] = useState(false);
        const [newTitle, setNewTitle] = useState(todo.title);

        const handleUpdate = () => {
            onUpdate(todo.id, newTitle);
            setIsEditing(false);
        };

        return (
            <li className="flex items-center justify-between p-2 bg-white rounded shadow mb-2">
                {isEditing ? (
                    <div className="flex items-center w-full">
                        <input
                            type="text"
                            value={newTitle}
                            onChange={(e) => setNewTitle(e.target.value)}
                            className="flex-grow p-1 border rounded"
                        />
                        <button
                            onClick={handleUpdate}
                            className="ml-2 bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600"
                        >
                            Save
                        </button>
                        <button
                            onClick={() => setIsEditing(false)}
                            className="ml-2 bg-gray-500 text-white px-2 py-1 rounded hover:bg-gray-600"
                        >
                            Cancel
                        </button>
                    </div>
                ) : (
                    <div className="flex items-center w-full">
                        <span className={todo.completed ? "line-through text-gray-500" : ""}>
                            {todo.title}
                        </span>
                        <div className="ml-auto flex space-x-2">
                            <button
                                onClick={() => setIsEditing(true)}
                                className="bg-yellow-500 text-white px-2 py-1 rounded hover:bg-yellow-600"
                            >
                                Edit
                            </button>
                            <button
                                onClick={() => onComplete(todo.id)}
                                className="bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600"
                                disabled={todo.completed}
                            >
                                {todo.completed ? "Completed" : "Complete"}
                            </button>
                            <button
                                onClick={() => onDelete(todo.id)}
                                className="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
                            >
                                Delete
                            </button>
                        </div>
                    </div>
                )}
            </li>
        );
    }

    // TodoList Component
    function TodoList() {
        const [todos, setTodos] = useState([]);
        const [newTodo, setNewTodo] = useState("");

        // Fetch todos on mount
        useEffect(() => {
            fetchTodos();
        }, []);

        const fetchTodos = async () => {
                 try {
                const response = await axios.get("http://localhost:8080/todos");
                setTodos(response.data);
            } catch (error) {
                console.error("Error fetching todos:", error);
            }
        };

        const addTodo = async () => {
            if (!newTodo.trim()) return;
            try {
                const response = await axios.post(`http://localhost:8080/todos?title=${encodeURIComponent(newTodo)}`);
                setTodos([...todos, response.data]);
                setNewTodo("");
            } catch (error) {
                console.error("Error adding todo:", error);
            }
        };

        const updateTodo = async (id, title) => {
            try {
                const response = await axios.put(`http://localhost:8080/todos/${id}/update?title=${encodeURIComponent(title)}`);
                setTodos(todos.map((todo) => (todo.id === id ? response.data : todo)));
            } catch (error) {
                console.error("Error updating todo:", error);
            }
        };

        const completeTodo = async (id) => {
            try {
                const response = await axios.put(`http://localhost:8080/todos/${id}/complete`);
                setTodos(todos.map((todo) => (todo.id === id ? response.data : todo)));
            } catch (error) {
                console.error("Error completing todo:", error);
            }
        };

        const deleteTodo = async (id) => {
            try {
                await axios.delete(`http://localhost:8080/todos/${id}`);
                setTodos(todos.filter((todo) => todo.id !== id));
            } catch (error) {
                console.error("Error deleting todo:", error);
            }
        };

        return (
            <div className="max-w-md mx-auto">
                <h1 className="text-2xl font-bold text-center mb-4">Todo List</h1>
                <div className="flex mb-4">
                    <input
                        type="text"
                        value={newTodo}
                        onChange={(e) => setNewTodo(e.target.value)}
                        placeholder="Add a new todo"
                        className="flex-grow p-2 border rounded-l"
                    />
                    <button
                        onClick={addTodo}
                        className="bg-blue-500 text-white px-4 py-2 rounded-r hover:bg-blue-600"
                    >
                        Add
                    </button>
                </div>
                <ul>
                    {todos.map((todo) => (
                        <TodoItem
                            key={todo.id}
                            todo={todo}
                            onUpdate={updateTodo}
                            onComplete={completeTodo}
                            onDelete={deleteTodo}
                        />
                    ))}
                </ul>
            </div>
        );
    }

    // Render the app
    ReactDOM.render(<TodoList />, document.getElementById("root"));
</script>
</body>
</html>
