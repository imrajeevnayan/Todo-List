<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
    <script src="https://unpkg.com/axios@1.7.7/dist/axios.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">
<div id="root" class="container mx-auto p-4"></div>
<script type="text/babel">
    function App() {
        const [todos, setTodos] = React.useState([]);
        const [inputText, setInputText] = React.useState('');

        // Fetch todos on component mount
        React.useEffect(() => {
            axios.get('https://todo-list-fo0g.onrender.com/todos')
                .then(response => setTodos(response.data))
                .catch(error => console.error('Error fetching todos:', error));
        }, []);

        // Handle input change
        const handleInputChange = (event) => {
            setInputText(event.target.value);
        };

        // Handle adding a todo
        const handleAddTodo = (event) => {
            event.preventDefault();
            if (inputText.trim() === '') return;
            axios.post('https://todo-list-fo0g.onrender.com/todos?title=' + encodeURIComponent(inputText))
                .then(response => {
                    setTodos([...todos, response.data]);
                    setInputText('');
                })
                .catch(error => console.error('Error adding todo:', error));
        };

        return (
            <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
                <h1 class="text-2xl font-bold mb-4 text-center">Todo List</h1>
                <form onSubmit={handleAddTodo} class="mb-4">
                    <input
                        type="text"
                        value={inputText}
                        onChange={handleInputChange}
                        placeholder="Add a new todo..."
                        class="w-full p-2 border rounded"
                    />
                    <button
                        type="submit"
                        class="w-full mt-2 bg-blue-500 text-white p-2 rounded hover:bg-blue-600"
                    >
                        Add
                    </button>
                </form>
                <ul class="space-y-2">
                    {todos.map(todo => (
                        <li key={todo.id} class="flex justify-between items-center p-2 border-b">
                            <span class={todo.completed ? 'line-through' : ''}>{todo.title}</span>
                        </li>
                    ))}
                </ul>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
